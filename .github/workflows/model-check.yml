# Pack SmolLM2-135M-Instruct for Dubiety and ask it a few questions, to check
# the game's model code against the real weights (by hand from Actions, or when the model code changes).
name: Model check

on:
  workflow_dispatch:
  push:
    paths:
      - src/online/smollm.rs
      - .github/workflows/model-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Download SmolLM2-135M-Instruct
        run: |
          mkdir hf
          for f in config.json tokenizer.json model.safetensors; do
            curl -fsSL -o "hf/$f" "https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct/resolve/main/$f"
          done
      - name: Pack and ask
        run: |
          ./target/release/minceraft --pack-model hf model.lm
          ls -l model.lm
          for q in "What is the capital of France?" "How do I make a torch?" "Say hello to a friend."; do
            echo "Q: $q"
            a=$(/usr/bin/time -v ./target/release/minceraft --ask-model model.lm "$q" 2>time.txt)
            echo "::notice title=$q::$a | $(grep -E 'Maximum resident' time.txt | xargs) | $(grep -E 'Elapsed' time.txt | xargs) | $(ls -l model.lm | awk '{print $5}') bytes"
          done
          ./target/release/minceraft --ask-model model.lm "What is the capital of France?" | grep -qi paris
