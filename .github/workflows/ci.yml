# Build, test and lint every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for sound, udev for game controllers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The tests include multiplayer games over real TCP on localhost; no display is needed.
      - name: Tests
        run: cargo test --release --locked
      # The mix-bus limiter in the patched quad-snd (see vendor/quad-snd/PATCHED.md).
      - name: Audio mixer tests
        run: cargo test --release --lib --manifest-path vendor/quad-snd/Cargo.toml
      # A host and six bots playing together for a minute; fails if they disagree about anything.
      - name: Multiplayer playtest
        run: cargo run --release --locked -- --playtest --bots 6 --seconds 60
      - name: Clippy
        run: cargo clippy --release --all-targets --locked
      - name: Minimal build (no sound or controller libraries)
        run: cargo check --release --locked --no-default-features

  # The release builds Windows and macOS too; build (and test, on Windows) them
  # here so a platform-only problem shows up on the pull request, not at release.
  other-platforms:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, test: true }
          - { name: macos, os: macos-latest, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        if: matrix.test
        run: cargo test --release --locked
