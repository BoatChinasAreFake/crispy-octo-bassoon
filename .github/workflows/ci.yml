# Build, test and lint every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for sound, udev for game controllers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The tests include multiplayer games over real TCP on localhost; no display is needed.
      - name: Tests
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --all-targets --locked
      - name: Minimal build (no sound or controller libraries)
        run: cargo check --release --locked --no-default-features
